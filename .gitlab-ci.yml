spec:
  inputs:
    fcli-version:
      default: 'v3.17.0'
      description: 'Fortify fcli version for remediation workflow (for example: v3.17.0)'
    platform:
      default: 'SSC'
      description: 'Fortify platform to remediate (SSC or FoD)'
---
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "api"'
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
    - when: never

include:
  - local: '.gitlab/ci/remediate.yml'
    inputs:
      fcli-version: $[[ inputs.fcli-version ]]
      platform: $[[ inputs.platform ]]
