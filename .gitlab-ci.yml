spec:
  inputs:
    fcli-version:
      default: 'v3.17.0'
      description: 'Fortify fcli version for remediation workflow (for example: v3.17.0)'
---
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "api"'
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
    - when: never

include:
  - local: '.gitlab/ci/remediate.yml'
    inputs:
      fcli-version: $[[ inputs.fcli-version ]]
